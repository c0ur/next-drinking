<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>次の一杯｜キンミヤ ルーレット</title>
<meta name="description" content="キンミヤ焼酎で作る次の一杯をド派手なルーレットで決めるアプリ" />

<!-- iOS standalone / home-screen app -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="次の一杯" />
<meta name="theme-color" content="#0c0028" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="icon" href="icons/favicon-96.png" sizes="96x96" type="image/png" />

<style>
  :root{
    --bg0:#0c0028; --bg1:#1a0033; --bg2:#2b0052;
    --neon-pink:#ff2fb9; --neon-cyan:#39e6ff; --neon-yellow:#ffe14d;
    --neon-purple:#b14bff; --amber:#ff9d2e;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; margin:0; }
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
    color:#fff; overflow:hidden; position:fixed; inset:0;
    background:
      radial-gradient(120% 90% at 50% -10%, #3a0066 0%, transparent 55%),
      radial-gradient(140% 120% at 50% 120%, #ff1e88 0%, transparent 45%),
      linear-gradient(160deg,var(--bg1),var(--bg0) 60%,#05001a);
    background-attachment:fixed;
    user-select:none; -webkit-user-select:none; touch-action:manipulation;
  }
  canvas.fx{ position:fixed; inset:0; width:100%; height:100%; pointer-events:none; }
  #bubbles{ z-index:0; }
  #confetti{ z-index:60; }

  .app{
    position:relative; z-index:10; height:100%;
    display:flex; flex-direction:column; align-items:center;
    padding:calc(var(--safe-t) + 10px) 18px calc(var(--safe-b) + 18px);
  }

  /* ---- header ---- */
  header{ width:100%; max-width:560px; display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
  .brand{ display:flex; flex-direction:column; line-height:1.1; min-width:0; }
  .brand .sub{ font-size:10.5px; letter-spacing:.3em; color:var(--neon-cyan);
    text-shadow:0 0 8px var(--neon-cyan); opacity:.9; }
  .brand .ttl{ font-size:21px; font-weight:900; letter-spacing:-.01em; white-space:nowrap;
    background:linear-gradient(90deg,var(--neon-yellow),var(--neon-pink),var(--neon-cyan));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 0 10px rgba(255,80,200,.5)); }
  .counter{ text-align:right; font-size:11px; color:#ffd9f2; opacity:.85; flex:none; white-space:nowrap; }
  .counter b{ display:block; font-size:22px; color:var(--neon-yellow);
    text-shadow:0 0 12px rgba(255,225,77,.7); font-variant-numeric:tabular-nums; }

  /* ---- slot / stage ---- */
  .stage{
    flex:1; width:100%; max-width:560px; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:22px; position:relative;
  }
  .reel{
    position:relative; width:100%; height:190px; border-radius:26px;
    background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(0,0,0,.35));
    box-shadow:
      inset 0 0 0 2px rgba(255,255,255,.10),
      inset 0 20px 40px rgba(0,0,0,.55),
      0 0 40px rgba(177,75,255,.35), 0 0 80px rgba(57,230,255,.18);
    overflow:hidden;
  }
  .reel::before,.reel::after{ content:""; position:absolute; left:0; right:0; height:64px; z-index:3; pointer-events:none; }
  .reel::before{ top:0; background:linear-gradient(180deg, rgba(6,0,26,.95), transparent); }
  .reel::after{ bottom:0; background:linear-gradient(0deg, rgba(6,0,26,.95), transparent); }
  .reel-line{ position:absolute; left:8px; right:8px; top:50%; height:74px; transform:translateY(-50%);
    border-radius:14px; z-index:4; pointer-events:none;
    box-shadow:0 0 0 2px var(--neon-yellow), 0 0 24px rgba(255,225,77,.55); }
  .reel-strip{ position:absolute; left:0; right:0; top:0; will-change:transform; }
  .cell{ height:74px; display:flex; align-items:center; justify-content:center; gap:10px; padding:0 14px; }
  .cell .emo{ font-size:34px; flex:none; filter:drop-shadow(0 3px 6px rgba(0,0,0,.5)); }
  .cell .nm{ font-size:clamp(18px,5.6vw,25px); font-weight:800; letter-spacing:-.01em; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis; text-shadow:0 0 14px rgba(255,255,255,.25); }

  /* ---- decide button ---- */
  .decide{
    position:relative; border:none; cursor:pointer; color:#1a0033;
    font-size:27px; font-weight:900; letter-spacing:.14em; padding:20px 30px;
    border-radius:999px; min-width:260px;
    background:linear-gradient(135deg,var(--neon-yellow),#ffa53a 45%,var(--neon-pink));
    box-shadow:0 10px 30px rgba(255,47,185,.5), 0 0 0 3px rgba(255,255,255,.25) inset;
    animation:pulse 1.5s ease-in-out infinite; transition:transform .08s ease;
    text-shadow:0 1px 0 rgba(255,255,255,.4);
  }
  .decide:active{ transform:scale(.94); }
  .decide[disabled]{ opacity:.55; animation:none; }
  @keyframes pulse{ 0%,100%{ box-shadow:0 10px 30px rgba(255,47,185,.45), 0 0 0 3px rgba(255,255,255,.25) inset, 0 0 0 0 rgba(255,225,77,.55);}
    50%{ box-shadow:0 12px 40px rgba(255,47,185,.65), 0 0 0 3px rgba(255,255,255,.25) inset, 0 0 44px 14px rgba(255,225,77,0);} }

  .hint{ font-size:12px; letter-spacing:.2em; color:#c9b6ff; opacity:.75; }

  /* ---- filter chips ---- */
  .filters{ width:100%; max-width:560px; display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
  .chip{ font-size:12.5px; font-weight:700; padding:8px 14px; border-radius:999px; cursor:pointer;
    color:#e9d6ff; background:rgba(255,255,255,.06); border:1.5px solid rgba(255,255,255,.14);
    transition:all .15s ease; }
  .chip.on{ color:#12002e; background:linear-gradient(120deg,var(--neon-cyan),var(--neon-purple));
    border-color:transparent; box-shadow:0 0 16px rgba(57,230,255,.5); }

  /* ---- toolbar ---- */
  .toolbar{ width:100%; max-width:560px; display:flex; gap:8px; justify-content:center; }
  .tbtn{ flex:1; font-size:12px; font-weight:700; color:#d9c8ff; cursor:pointer;
    padding:11px 8px; border-radius:14px; background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.12); text-align:center; }
  .tbtn.off{ opacity:.45; }

  /* ---- result overlay ---- */
  .overlay{ position:fixed; inset:0; z-index:70; display:none; align-items:flex-start; justify-content:center;
    overflow-y:auto; -webkit-overflow-scrolling:touch;
    padding:calc(var(--safe-t) + 20px) 20px calc(var(--safe-b) + 20px);
    background:radial-gradient(120% 90% at 50% 30%, rgba(60,0,110,.55), rgba(3,0,18,.9));
    backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px); }
  .overlay .card{ margin:auto; }
  .overlay.show{ display:flex; animation:ovin .35s ease; }
  @keyframes ovin{ from{ opacity:0; } to{ opacity:1; } }
  .card{ position:relative; width:100%; max-width:440px; border-radius:30px; padding:26px 24px 24px;
    text-align:center; background:linear-gradient(180deg, rgba(40,0,80,.92), rgba(12,0,40,.96));
    box-shadow:0 20px 70px rgba(0,0,0,.6), inset 0 0 0 2px rgba(255,255,255,.10),
      0 0 60px rgba(255,47,185,.35); animation:cardpop .55s cubic-bezier(.2,1.3,.5,1); }
  @keyframes cardpop{ 0%{ transform:scale(.5) translateY(40px); opacity:0; } 60%{ transform:scale(1.05); }
    100%{ transform:scale(1) translateY(0); opacity:1; } }
  .card .verdict{ font-size:12px; letter-spacing:.4em; color:var(--neon-cyan); text-shadow:0 0 10px var(--neon-cyan); }
  .card .bigemo{ font-size:96px; line-height:1.1; margin:6px 0 2px; display:inline-block; animation:bob 1.6s ease-in-out infinite; }
  @keyframes bob{ 0%,100%{ transform:translateY(0) rotate(-3deg);} 50%{ transform:translateY(-10px) rotate(3deg);} }
  .card .drink{ font-size:34px; font-weight:900;
    background:linear-gradient(90deg,var(--neon-yellow),var(--neon-pink),var(--neon-cyan));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 0 14px rgba(255,80,200,.6)); animation:glitch 2.4s infinite; }
  @keyframes glitch{ 0%,92%,100%{ transform:none; } 93%{ transform:translate(-2px,1px);} 95%{ transform:translate(2px,-1px);} 97%{ transform:translate(-1px,0);} }
  .card .yomi{ font-size:13px; color:#c9b6ff; letter-spacing:.12em; margin-top:2px; }
  .card .cmt{ font-size:14px; color:#ffe6f7; margin:14px 6px 6px; line-height:1.6; }

  .recipe{ text-align:left; margin:14px 0 6px; background:rgba(0,0,0,.28); border-radius:18px; padding:14px 16px;
    border:1px solid rgba(255,255,255,.10); }
  .recipe h4{ margin:0 0 8px; font-size:12px; letter-spacing:.22em; color:var(--neon-yellow); }
  .recipe .ing{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
  .recipe .ing span{ font-size:12px; padding:5px 10px; border-radius:999px; background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.12); }
  .recipe ol{ margin:0; padding-left:18px; }
  .recipe li{ font-size:13.5px; line-height:1.7; color:#efe4ff; }

  .meters{ display:flex; gap:14px; margin:14px 2px 4px; }
  .meter{ flex:1; }
  .meter .lab{ font-size:11px; color:#c9b6ff; letter-spacing:.15em; margin-bottom:5px; display:flex; justify-content:space-between; }
  .bar{ height:9px; border-radius:999px; background:rgba(255,255,255,.10); overflow:hidden; }
  .bar > i{ display:block; height:100%; border-radius:999px; width:0; transition:width .8s cubic-bezier(.2,1,.3,1); }
  .bar.str > i{ background:linear-gradient(90deg,#ffd24d,#ff5a3c); box-shadow:0 0 12px rgba(255,90,60,.6); }
  .bar.fiz > i{ background:linear-gradient(90deg,#39e6ff,#b14bff); box-shadow:0 0 12px rgba(57,230,255,.6); }

  .again{ margin-top:18px; width:100%; border:none; cursor:pointer; color:#12002e; font-size:20px; font-weight:900;
    letter-spacing:.14em; padding:17px; border-radius:999px;
    background:linear-gradient(135deg,var(--neon-cyan),var(--neon-purple));
    box-shadow:0 10px 30px rgba(57,230,255,.4); transition:transform .08s ease; }
  .again:active{ transform:scale(.95); }
  .close{ position:absolute; top:12px; right:16px; font-size:24px; color:#fff; opacity:.6; cursor:pointer;
    background:none; border:none; }

  .kanpai{ position:fixed; z-index:80; inset:0; display:none; align-items:center; justify-content:center; pointer-events:none; }
  .kanpai.show{ display:flex; }
  .kanpai span{ font-size:74px; font-weight:900; letter-spacing:.1em;
    background:linear-gradient(90deg,var(--neon-yellow),var(--neon-pink));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 0 40px rgba(255,225,77,.6); animation:kan .9s ease forwards; }
  @keyframes kan{ 0%{ transform:scale(.3) rotate(-12deg); opacity:0; } 40%{ transform:scale(1.15) rotate(4deg); opacity:1; }
    70%{ transform:scale(1) rotate(0);} 100%{ transform:scale(1.4); opacity:0; } }

  /* ---- spin FX ---- */
  .reel-wrap{ position:relative; width:100%; max-width:560px; }
  .reel-glow{ position:absolute; inset:-34px; z-index:-1; border-radius:44px; opacity:0; transition:opacity .3s;
    background:conic-gradient(from 0deg, var(--neon-pink),var(--neon-cyan),var(--neon-yellow),var(--neon-purple),var(--neon-pink));
    filter:blur(28px); }
  body.spinning .reel-glow{ opacity:.8; animation:spinglow 1s linear infinite; }
  @keyframes spinglow{ to{ transform:rotate(360deg);} }
  .reel.spinning{ animation:reelhue .5s linear infinite;
    box-shadow:inset 0 0 0 2px rgba(255,255,255,.20), inset 0 20px 40px rgba(0,0,0,.55),
      0 0 60px rgba(255,47,185,.65), 0 0 130px rgba(57,230,255,.45); }
  @keyframes reelhue{ to{ filter:hue-rotate(360deg);} }
  .reel.hot{ box-shadow:inset 0 0 0 2px #fff, 0 0 70px var(--neon-yellow), 0 0 150px var(--neon-pink) !important; }

  .reach{ position:fixed; z-index:66; left:50%; top:36%; transform:translate(-50%,-50%) scale(.4);
    font-size:44px; font-weight:900; letter-spacing:.06em; color:#fff; opacity:0; pointer-events:none; white-space:nowrap;
    text-shadow:0 0 20px var(--neon-pink),0 0 44px var(--neon-pink),0 0 60px var(--neon-yellow); }
  .reach.show{ animation:reachpop .45s cubic-bezier(.2,1.4,.4,1) forwards, reachflash .28s steps(1) infinite .45s; }
  @keyframes reachpop{ to{ opacity:1; transform:translate(-50%,-50%) scale(1);} }
  @keyframes reachflash{ 50%{ color:var(--neon-yellow); transform:translate(-50%,-50%) scale(1.08);} }

  .shock{ position:fixed; z-index:64; left:50%; top:42%; width:40px; height:40px; margin:-20px 0 0 -20px;
    border-radius:50%; border:6px solid rgba(255,255,255,.95); pointer-events:none; animation:shock .6s ease-out forwards; }
  @keyframes shock{ from{ transform:scale(0); opacity:.9; } to{ transform:scale(22); opacity:0; } }
  .shock.c2{ border-color:var(--neon-cyan); animation-duration:.75s; }

  .eburst{ position:fixed; z-index:63; pointer-events:none; transform:translate(-50%,-50%);
    animation:eburst 1s ease-out forwards; }
  @keyframes eburst{ 0%{ transform:translate(-50%,-50%) scale(.3); opacity:0; } 18%{ opacity:1; }
    100%{ transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.3) rotate(220deg); opacity:0; } }

  /* ---- ジャグラー風 GOGO! ペカリ ---- */
  .gogo{ position:fixed; z-index:79; left:50%; top:19%; pointer-events:none; opacity:0;
    display:flex; flex-direction:column; align-items:center; gap:8px;
    transform:translate(-50%,-50%) scale(.3); }
  .gogo.show{ opacity:1; transform:translate(-50%,-50%) scale(1);
    transition:transform .25s cubic-bezier(.2,1.5,.4,1), opacity .2s; }
  .gogo .lamp{ font-weight:900; font-style:italic; font-size:62px; letter-spacing:.01em; color:#ff2323;
    padding:14px 32px 18px; border-radius:20px; -webkit-text-stroke:2.5px #fff;
    text-shadow:0 2px 5px rgba(0,0,0,.45),0 0 14px rgba(255,255,255,.5); paint-order:stroke fill;
    background:radial-gradient(circle at 50% 32%, #fff6b0, #ffcf33 42%, #ff8a00 82%);
    border:4px solid rgba(255,255,255,.9);
    box-shadow:0 0 42px 8px rgba(255,200,40,.85), inset 0 0 20px rgba(255,255,255,.7), 0 8px 24px rgba(0,0,0,.5);
    animation:peka .28s steps(1) infinite; }
  .gogo .pekasub{ font-size:15px; font-weight:800; color:#fff; letter-spacing:.06em;
    text-shadow:0 0 12px var(--neon-yellow),0 0 24px var(--neon-pink); animation:peka .28s steps(1) infinite; }
  .gogo.premium .lamp{ -webkit-text-stroke:2px rgba(0,0,0,.4);
    background:conic-gradient(from 0deg,#ff2fb9,#ffe14d,#39e6ff,#b14bff,#ff2fb9);
    box-shadow:0 0 54px 12px rgba(255,120,220,.85), inset 0 0 24px rgba(255,255,255,.8), 0 8px 24px rgba(0,0,0,.5);
    animation:peka .22s steps(1) infinite, gogohue 1s linear infinite; }
  @keyframes gogohue{ to{ filter:hue-rotate(360deg);} }
  @keyframes peka{ 0%,44%{ opacity:1; transform:scale(1.06); filter:brightness(1.25); }
    45%,100%{ opacity:.36; transform:scale(1); filter:brightness(.6); } }

  @media (max-height:680px){
    .reel{ height:160px; } .cell{ height:62px; } .reel-line{ height:62px; }
    .cell .emo{ font-size:32px; } .cell .nm{ font-size:22px; }
    .decide{ font-size:23px; padding:16px 26px; }
    .card .bigemo{ font-size:74px; }
  }
</style>
</head>
<body>
  <canvas id="bubbles" class="fx"></canvas>
  <canvas id="confetti" class="fx"></canvas>

  <div class="app">
    <header>
      <div class="brand">
        <span class="sub">KINMIYA ROULETTE</span>
        <span class="ttl">次の一杯、なに飲む？</span>
      </div>
      <div class="counter">今日の乾杯<b id="count">0</b>杯</div>
    </header>

    <div class="stage">
      <div class="reel-wrap">
        <div class="reel-glow"></div>
        <div class="reel" id="reel">
          <div class="reel-strip" id="strip"></div>
          <div class="reel-line"></div>
        </div>
      </div>
      <button class="decide" id="decide">🎰 きめる！</button>
      <div class="hint" id="hint">ボタンをタップして運命の一杯を</div>
    </div>

    <div class="filters" id="filters">
      <div class="chip on" data-f="all">ぜんぶ</div>
      <div class="chip" data-f="fizz">炭酸あり</div>
      <div class="chip" data-f="nofizz">炭酸なし</div>
      <div class="chip" data-f="strong">強め</div>
      <div class="chip" data-f="light">軽め</div>
    </div>

    <div class="toolbar">
      <div class="tbtn" id="tSound">🔊 サウンド</div>
      <div class="tbtn" id="tHaptic">📳 バイブ</div>
      <div class="tbtn" id="tReset">↺ カウンタ</div>
    </div>
  </div>

  <!-- result -->
  <div class="overlay" id="overlay">
    <div class="card">
      <button class="close" id="close">×</button>
      <div class="verdict">本日のご神託は…</div>
      <div class="bigemo" id="rEmo">🍋</div>
      <div class="drink" id="rName">レモンサワー</div>
      <div class="yomi" id="rYomi"></div>
      <div class="cmt" id="rCmt"></div>

      <div class="recipe">
        <h4>材料</h4>
        <div class="ing" id="rIng"></div>
        <h4>つくりかた</h4>
        <ol id="rSteps"></ol>
      </div>

      <div class="meters">
        <div class="meter">
          <div class="lab"><span>強さ</span><span id="rStrLab"></span></div>
          <div class="bar str"><i id="rStrBar"></i></div>
        </div>
        <div class="meter">
          <div class="lab"><span>炭酸</span><span id="rFizLab"></span></div>
          <div class="bar fiz"><i id="rFizBar"></i></div>
        </div>
      </div>

      <button class="again" id="again">🍶 もう一杯きめる！</button>
    </div>
  </div>

  <div class="reach" id="reach">🔥 リーチ！！ 🔥</div>
  <div class="gogo" id="gogo">
    <div class="lamp">GOGO!</div>
    <div class="pekasub">ペカッ！強い一杯だ🔥</div>
  </div>
  <div class="kanpai" id="kanpai"><span>🥂 かんぱーい！</span></div>

<script>
/* ============================================================
   キンミヤ焼酎で作れるドリンク（架空の外部依存なし・完全オフライン）
   ============================================================ */
const DRINKS = [
  { name:"キンミヤレモンサワー", yomi:"KINMIYA LEMON SOUR", emo:"🍋", str:3, fiz:5,
    cmt:"王道にして頂点。キンミヤの澄んだ甘みがレモンで無限に飲める危険な一杯。",
    ing:["キンミヤ 60ml","レモン果汁 1/2個","無糖炭酸 適量","氷 たっぷり"],
    steps:["氷を詰めたグラスにキンミヤを注ぐ","レモンを搾って入れる","冷えた炭酸をゆっくり注ぐ","一度だけ縦に混ぜて完成"] },
  { name:"生キンミヤ 炭酸割り", yomi:"NAMA KINMIYA SODA", emo:"🫧", str:3, fiz:5,
    cmt:"割り物は炭酸だけ。キンミヤの実力が丸裸になる硬派な生。",
    ing:["キンミヤ 60ml","無糖炭酸 120ml","氷"],
    steps:["キンキンに冷やしたグラスに氷","キンミヤを注ぐ","炭酸を静かに注ぎ、混ぜすぎない"] },
  { name:"緑茶ハイ", yomi:"GREEN TEA HIGH", emo:"🍵", str:3, fiz:1,
    cmt:"渋みと旨みでいくらでも。食事に最強に寄り添う定番ハイ。",
    ing:["キンミヤ 60ml","冷たい緑茶 150ml","氷"],
    steps:["氷を入れたジョッキにキンミヤ","濃いめの緑茶を注ぐ","軽く混ぜる"] },
  { name:"ウーロンハイ", yomi:"OOLONG HIGH", emo:"🧋", str:3, fiz:1,
    cmt:"香ばしさで箸が進む。ザ・大衆酒場の味。",
    ing:["キンミヤ 60ml","ウーロン茶 150ml","氷"],
    steps:["ジョッキに氷とキンミヤ","冷たいウーロン茶を注ぐ","ひと混ぜ"] },
  { name:"ホッピー", yomi:"HOPPY SET", emo:"🍺", str:3, fiz:4,

/* ---------- state ---------- */
const store = {
  get sound(){ return localStorage.getItem("k_sound") !== "0"; },
  set sound(v){ localStorage.setItem("k_sound", v ? "1" : "0"); },
  get haptic(){ return localStorage.getItem("k_haptic") !== "0"; },
  set haptic(v){ localStorage.setItem("k_haptic", v ? "1" : "0"); },
  get count(){ return +(localStorage.getItem("k_count") || 0); },
  set count(v){ localStorage.setItem("k_count", v); },
};
let filter = "all";
let spinning = false;

function pool(){
  return DRINKS.filter(d=>{
    if(filter==="fizz") return d.fiz>=3;
    if(filter==="nofizz") return d.fiz<3;
    if(filter==="strong") return d.str>=4;
    if(filter==="light") return d.str<=2;
    return true;
  });
}

/* ============================================================
   Audio engine (WebAudio, no files)
   ============================================================ */
let AC=null, master=null, reverb=null;
function makeImpulse(dur,decay){
  const n=Math.floor(AC.sampleRate*dur), b=AC.createBuffer(2,n,AC.sampleRate);
  for(let ch=0;ch<2;ch++){ const d=b.getChannelData(ch);
    for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,decay); }
  return b;
}
function ac(){
  if(!AC){
    try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; }
    master=AC.createGain(); master.gain.value=0.95; master.connect(AC.destination);
    reverb=AC.createConvolver(); reverb.buffer=makeImpulse(2.4,2.6);
    const rg=AC.createGain(); rg.gain.value=0.24; reverb.connect(rg).connect(AC.destination);
  }
  if(AC.state==="suspended") AC.resume();
  return AC;
}
/* route a node to dry master + a wet reverb send */
function out(node,wet=0.3){
  if(!master) return; node.connect(master);
  if(reverb && wet>0){ const s=AC.createGain(); s.gain.value=wet; node.connect(s); s.connect(reverb); }
}
function tone(freq,t0,dur,type="triangle",vol=0.3,wet=0.3){
  const c=ac(); if(!c||!store.sound) return;
  const o=c.createOscillator(), g=c.createGain();
  o.type=type; o.frequency.setValueAtTime(freq,t0);
  g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(vol,t0+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g); out(g,wet); o.start(t0); o.stop(t0+dur+0.02);
}
function boom(t0,f0,dur,vol,wet=0.2){ /* sub-bass impact */
  const c=ac(); if(!c||!store.sound) return;
  const o=c.createOscillator(), g=c.createGain(); o.type="sine";
  o.frequency.setValueAtTime(f0,t0); o.frequency.exponentialRampToValueAtTime(f0*0.32,t0+dur);
  g.gain.setValueAtTime(vol,t0); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g); out(g,wet); o.start(t0); o.stop(t0+dur+0.02);
}
function crash(t0,dur,vol,hp=4000){ /* cymbal / white-noise decay */
  const c=ac(); if(!c||!store.sound) return;
  const n=Math.floor(c.sampleRate*dur), b=c.createBuffer(1,n,c.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,1.4);
  const s=c.createBufferSource(); s.buffer=b;
  const f=c.createBiquadFilter(); f.type="highpass"; f.frequency.value=hp;
  const g=c.createGain(); g.gain.setValueAtTime(vol,t0); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  s.connect(f).connect(g); out(g,0.5); s.start(t0);
}
function sndWhoosh(){ /* spin start */
  const c=ac(); if(!c||!store.sound) return; const t=c.currentTime;
  const n=Math.floor(c.sampleRate*0.5), b=c.createBuffer(1,n,c.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1);
  const s=c.createBufferSource(); s.buffer=b;
  const f=c.createBiquadFilter(); f.type="bandpass"; f.Q.value=1.1;
  f.frequency.setValueAtTime(280,t); f.frequency.exponentialRampToValueAtTime(3200,t+0.45);
  const g=c.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(0.4,t+0.12);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.5);
  s.connect(f).connect(g); out(g,0.4); s.start(t); s.stop(t+0.55);
}
let riserNodes=null;
function sndRiser(dur){ /* rising tension bed across the whole spin */
  const c=ac(); if(!c||!store.sound) return; const t=c.currentTime;
  const g=c.createGain();
  g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(0.14,t+dur*0.65);
  g.gain.linearRampToValueAtTime(0.26,t+dur); g.gain.exponentialRampToValueAtTime(0.0001,t+dur+0.15);
  const f=c.createBiquadFilter(); f.type="lowpass"; f.Q.value=7;
  f.frequency.setValueAtTime(180,t); f.frequency.exponentialRampToValueAtTime(4200,t+dur);
  g.connect(f); out(f,0.35);
  const oscs=[55,55.4,110].map(base=>{ const o=c.createOscillator(); o.type="sawtooth";
    o.frequency.setValueAtTime(base,t); o.frequency.exponentialRampToValueAtTime(base*4.2,t+dur);
    o.connect(g); o.start(t); o.stop(t+dur+0.2); return o; });
  riserNodes={g,oscs};
}
function stopRiser(){ if(riserNodes){ const t=ac().currentTime;
  try{ riserNodes.g.gain.cancelScheduledValues(t); riserNodes.g.gain.setValueAtTime(riserNodes.g.gain.value,t);
    riserNodes.g.gain.exponentialRampToValueAtTime(0.0001,t+0.1); }catch(e){} riserNodes=null; } }
function sndClick(){ const c=ac(); if(!c) return; const t=c.currentTime;
  tone(520,t,0.08,"square",0.18,0.1); tone(780,t+0.02,0.08,"square",0.13,0.1); }
function sndTick(){ const c=ac(); if(!c) return; tone(1200,c.currentTime,0.03,"square",0.12,0.1); }
function sndTickP(p){ /* reel tick, pitch rises as it slows */
  const c=ac(); if(!c) return; tone(680+p*1000,c.currentTime,0.032,"square",0.13,0.08); }
function sndReach(){ /* near-miss stinger + heartbeat */
  const c=ac(); if(!c||!store.sound) return; const t=c.currentTime;
  tone(880,t,0.55,"sawtooth",0.13,0.5); tone(1174,t,0.55,"sawtooth",0.11,0.5);
  boom(t,95,0.2,0.5,0.4); boom(t+0.34,95,0.2,0.5,0.4);
  crash(t,0.3,0.12,7000);
}
function sndWin(){ /* big landing */
  const c=ac(); if(!c||!store.sound) return; const t=c.currentTime;
  boom(t,150,0.55,0.7,0.25);          // impact
  crash(t,1.3,0.34);                  // cymbal
  [523,659,784,1046].forEach(f=>tone(f,t,0.6,"square",0.15,0.4));   // power chord
  const arp=[784,988,1174,1568,1976,2637];                          // rising sparkle
  arp.forEach((f,i)=>tone(f,t+0.12+i*0.055,0.4,"triangle",0.13,0.6));
  tone(1046,t+0.42,0.8,"sawtooth",0.09,0.5);
  boom(t+0.42,110,0.6,0.4,0.3);
}
function sndGako(){ /* ジャグラー風「ガコッ」 mechanical announce */
  const c=ac(); if(!c||!store.sound) return; const t=c.currentTime;
  const o=c.createOscillator(), g=c.createGain(); o.type="square";
  o.frequency.setValueAtTime(190,t); o.frequency.exponentialRampToValueAtTime(58,t+0.09);
  g.gain.setValueAtTime(0.5,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.13);
  o.connect(g); out(g,0.15); o.start(t); o.stop(t+0.15);
  boom(t,130,0.16,0.55,0.2); crash(t,0.06,0.28,2200);
}
function sndPeka(t0,premium){ /* single bright ペカ chime */
  tone(premium?2093:1568,t0,0.2,"triangle",0.18,0.45);
  tone(premium?2793:2093,t0,0.2,"sine",0.12,0.45);
}
function sndPekari(premium){
  const c=ac(); if(!c||!store.sound) return; const t=c.currentTime;
  sndGako();
  const beeps=premium?6:4, gap=premium?0.22:0.28;
  for(let i=0;i<beeps;i++) sndPeka(t+0.26+i*gap,premium);
  if(premium){ crash(t,1.4,0.26); [1046,1318,1568,2093].forEach((f,i)=>tone(f,t+0.3+i*0.1,0.5,"triangle",0.12,0.6)); }
}

/* ============================================================
   Haptics
   ============================================================ */
function buzz(p){ if(store.haptic && navigator.vibrate) navigator.vibrate(p); }

/* ============================================================
   Reel (slot strip)
   ============================================================ */
const strip=document.getElementById("strip");
function cellH(){ return document.querySelector('.reel-line').offsetHeight; }
let stripItems=[];
function buildStrip(list){
  const reps=Math.max(12, Math.ceil(140/list.length));
  stripItems=[];
  for(let r=0;r<reps;r++) for(const d of list) stripItems.push(d);
  strip.innerHTML = stripItems.map(d=>
    `<div class="cell" style="height:${cellH()}px"><span class="emo">${d.emo}</span><span class="nm">${d.name}</span></div>`
  ).join("");
}
buildStrip(pool());

function centerOffset(){ return (document.getElementById("reel").offsetHeight - cellH())/2; }
function setY(y){ strip.style.transform=`translateY(${y}px)`; }
setY(centerOffset());

/* ============================================================
   Spin!
   ============================================================ */
function spin(){
  if(spinning) return;
  const list=pool();
  buildStrip(list);
  const h=cellH();
  const winner=Math.floor(Math.random()*list.length);
  // target index near the end of the strip for a long travel
  const baseCount=stripItems.length;
  let targetIdx=baseCount - list.length + winner;
  const targetY = centerOffset() - targetIdx*h;

  const reel=document.getElementById("reel");
  spinning=true;
  document.getElementById("decide").disabled=true;
  document.getElementById("hint").textContent="運命をシャッフル中…🎰";
  reel.classList.add("spinning"); document.body.classList.add("spinning");

  const DUR=3900;
  ac(); sndWhoosh(); sndRiser(DUR/1000);
  buzz([0,20,30,20,30,20,30,20,30,20,30]);

  const startY=centerOffset();
  const t0=performance.now();
  let lastIdx=-1, lastTickT=0, prevY=startY, reached=false;

  // fast → long slowdown → tiny settle "click"
  function spinEase(p){
    if(p<0.9){ const q=p/0.9; return (1-Math.pow(1-q,4))*0.9855; }
    const q=(p-0.9)/0.1;
    const settle=Math.sin(q*Math.PI*3)*Math.pow(1-q,2)*0.02;
    return 0.9855 + 0.0145*q + settle;
  }
  function frame(now){
    let p=(now-t0)/DUR; if(p>1) p=1;
    const y=startY+(targetY-startY)*spinEase(p);
    setY(y);
    // speed → motion blur + bubble boost
    const speed=Math.abs(y-prevY); prevY=y;
    strip.style.filter = speed>1.5 ? `blur(${Math.min(7,speed*0.16)}px)` : "none";
    spinBoost = 1 + Math.min(7, speed*0.24);
    // pitched ticks as cells cross the line (throttled so it never machine-guns)
    const idx=Math.round((centerOffset()-y)/h);
    if(idx!==lastIdx && now-lastTickT>26){ lastIdx=idx; lastTickT=now; if(p<0.996) sndTickP(p); }
    // リーチ！ near-miss tease
    if(!reached && p>0.82){ reached=true; showReach(); sndReach(); buzz([0,130,70,130]); reel.classList.add("hot"); }
    // shake: subtle early, violent at the drop
    const sh = p<0.5 ? 1.4 : 2 + (p-0.5)*24;
    reel.style.transform=`translate(${(Math.random()-0.5)*sh}px, ${(Math.random()-0.5)*sh*0.4}px)`;
    if(p<1) requestAnimationFrame(frame);
    else{
      reel.style.transform=""; strip.style.filter="none";
      reel.classList.remove("spinning","hot"); document.body.classList.remove("spinning");
      hideReach(); stopRiser(); land(list[winner]);
    }
  }
  requestAnimationFrame(frame);
}

/* ジャグラー風ペカリ: 強め(str>=4)の一杯のときだけ GOGO! ランプ告知 */
function pekari(premium){
  const g=document.getElementById("gogo");
  g.querySelector(".pekasub").textContent = premium ? "ペカッ！プレミア級の一杯だ🌈" : "ペカッ！強い一杯だ🔥";
  g.classList.toggle("premium", premium);
  g.classList.remove("show"); void g.offsetWidth; g.classList.add("show");
  sndPekari(premium);
  buzz(premium ? [0,70,40,70,40,70,40,70,40,160] : [0,70,40,70,40,70,40,140]);
  const dur = premium ? 2100 : 1500;
  setTimeout(()=>g.classList.remove("show"), dur);
  return dur;
}

function land(d){
  spinning=false; spinBoost=1;
  const strong = d.str>=4, premium = d.str>=5;
  buzz([0,90,50,200,40,140]);
  sndWin();
  flash();
  shockwave();
  confettiBurst(premium?320:240);
  setTimeout(()=>confettiBurst(120), 240);
  emojiBurst(d.emo);
  showKanpai();
  store.count = store.count+1; renderCount();
  let delay=640;
  if(strong){ const pd=pekari(premium); delay=pd+320; }  // let the lamp blink before the card
  setTimeout(()=>showResult(d), delay);
}

/* ============================================================
   Effects: flash, confetti, bubbles, kanpai
   ============================================================ */
function flash(){
  const f=document.createElement("div");
  f.style.cssText="position:fixed;inset:0;z-index:65;background:#fff;pointer-events:none;opacity:.85;transition:opacity .4s;";
  document.body.appendChild(f);
  requestAnimationFrame(()=>{ f.style.opacity="0"; });
  setTimeout(()=>f.remove(),450);
}

  setTimeout(()=>k.classList.remove("show"),950); }

function shockwave(){
  for(const cls of ["","c2"]){ const w=document.createElement("div"); w.className="shock "+cls;
    document.body.appendChild(w); setTimeout(()=>w.remove(),800); }
}
function emojiBurst(emo){
  for(let i=0;i<16;i++){ const s=document.createElement("div"); s.className="eburst"; s.textContent=emo;
    const ang=Math.random()*Math.PI*2, dist=110+Math.random()*200;
    s.style.setProperty("--dx",Math.cos(ang)*dist+"px");
    s.style.setProperty("--dy",(Math.sin(ang)*dist-90)+"px");
    s.style.left="50%"; s.style.top="42%"; s.style.fontSize=(22+Math.random()*24)+"px";
    document.body.appendChild(s); setTimeout(()=>s.remove(),1100);
  }
}

/* confetti */
const cCanvas=document.getElementById("confetti"), cx=cCanvas.getContext("2d");
let confetti=[];
const COLORS=["#ff2fb9","#39e6ff","#ffe14d","#b14bff","#ff9d2e","#ffffff"];
function confettiBurst(n){
  const W=cCanvas.width, H=cCanvas.height;
  for(let i=0;i<n;i++){
    confetti.push({
      x:W/2 + (Math.random()-0.5)*80, y:H*0.42,
      vx:(Math.random()-0.5)*16, vy:-6-Math.random()*14,
      g:0.32+Math.random()*0.14, s:6+Math.random()*8,
      rot:Math.random()*Math.PI, vr:(Math.random()-0.5)*0.4,
      col:COLORS[(Math.random()*COLORS.length)|0], life:1,
      shape:Math.random()<0.5?0:1,
    });
  }
}
/* bubbles background */
const bCanvas=document.getElementById("bubbles"), bx=bCanvas.getContext("2d");
let bubbles=[], spinBoost=1;
function resize(){
  for(const cv of [cCanvas,bCanvas]){ cv.width=innerWidth*devicePixelRatio; cv.height=innerHeight*devicePixelRatio; }
  cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  bx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
}
addEventListener("resize",resize); resize();
function seedBubbles(){
  bubbles=[]; const n=Math.round(innerWidth*innerHeight/16000);
  for(let i=0;i<n;i++) bubbles.push({
    x:Math.random()*innerWidth, y:Math.random()*innerHeight,
    r:2+Math.random()*7, sp:0.3+Math.random()*1.1, a:0.1+Math.random()*0.35,
    hue:Math.random()<0.5?"57,230,255":"255,47,185", drift:(Math.random()-0.5)*0.4,
  });
}
seedBubbles();
function loop(){
  // bubbles
  bx.clearRect(0,0,innerWidth,innerHeight);
  for(const b of bubbles){
    b.y-=b.sp*spinBoost; b.x+=b.drift*(0.4+spinBoost*0.6);
    if(b.y<-10){ b.y=innerHeight+10; b.x=Math.random()*innerWidth; }
    bx.beginPath(); bx.arc(b.x,b.y,b.r,0,7);
    const a=Math.min(0.7, b.a*(1+(spinBoost-1)*0.25));
    bx.fillStyle=`rgba(${b.hue},${a})`; bx.fill();
  }
  // confetti
  cx.clearRect(0,0,innerWidth,innerHeight);
  confetti=confetti.filter(p=>p.life>0 && p.y<innerHeight+40);
  for(const p of confetti){
    p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.vx*=0.99; p.rot+=p.vr;
    if(p.y>innerHeight*0.9) p.life-=0.02;
    cx.save(); cx.translate(p.x,p.y); cx.rotate(p.rot); cx.globalAlpha=Math.max(0,p.life);
    cx.fillStyle=p.col;
    if(p.shape===0) cx.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.6);
    else{ cx.beginPath(); cx.arc(0,0,p.s/2,0,7); cx.fill(); }
    cx.restore();
  }
  requestAnimationFrame(loop);
}
loop();

/* ============================================================
   Wire up UI
   ============================================================ */
function renderCount(){ document.getElementById("count").textContent=store.count; }
function renderToggles(){
  document.getElementById("tSound").classList.toggle("off",!store.sound);
  document.getElementById("tHaptic").classList.toggle("off",!store.haptic);
}
renderCount(); renderToggles();

document.getElementById("decide").addEventListener("click",()=>{ sndClick(); spin(); });
document.getElementById("again").addEventListener("click",()=>{ closeResult(); setTimeout(spin,120); });
document.getElementById("close").addEventListener("click",closeResult);
document.getElementById("overlay").addEventListener("click",e=>{ if(e.target.id==="overlay") closeResult(); });

document.getElementById("filters").addEventListener("click",e=>{
  const c=e.target.closest(".chip"); if(!c) return;
  filter=c.dataset.f;
  [...document.querySelectorAll(".chip")].forEach(x=>x.classList.toggle("on",x===c));
  buildStrip(pool()); setY(centerOffset()); sndTick();
});

document.getElementById("tSound").addEventListener("click",()=>{ store.sound=!store.sound; renderToggles(); if(store.sound) sndClick(); });
document.getElementById("tHaptic").addEventListener("click",()=>{ store.haptic=!store.haptic; renderToggles(); buzz(30); });
document.getElementById("tReset").addEventListener("click",()=>{ store.count=0; renderCount(); sndTick(); });

/* keep reel centered on rotate/resize */
addEventListener("resize",()=>{ buildStrip(pool()); setY(centerOffset()); });

/* service worker for offline standalone use */
if("serviceWorker" in navigator){
  addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
